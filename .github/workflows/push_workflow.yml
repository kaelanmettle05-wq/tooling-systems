name: push pipeline, just to see what happens

on:
    push:
        branches: chore/commitlint-config

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0

        steps:
            - name: Checkout
              uses: actions/checkout@v4
             
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --if-present

            - name: Test
              run: npm test --if-present

            - name: build
              run: npm run build --if-present
            